name: Testes das regras propostas (TSI e RASTREL)

# Testa as PROPOSTAS em integracao/*.rules no emulador oficial.
# Não publica nada nos projetos reais.

on:
  push:
    paths: ['integracao/**', 'tests/regras-tsi.test.mjs', 'tests/regras-rastrel.test.mjs', '.github/workflows/testes-modulos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Instalar
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: TSI
        working-directory: tests
        run: npx firebase-tools@13 emulators:exec --only firestore --project demo-tsi --config ../integracao/firebase.json "node --test regras-tsi.test.mjs"
      - name: RASTREL
        working-directory: tests
        run: npx firebase-tools@13 emulators:exec --only firestore --project demo-rastrel --config ../integracao/firebase.json "node --test regras-rastrel.test.mjs"
